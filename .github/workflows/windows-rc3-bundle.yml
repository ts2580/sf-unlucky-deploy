name: RC3 Windows SQLite bundle

on:
  push:
    branches: [feature/rc3-windows-bundle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 고정 npm CLI 준비
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/npm-tools" npm@11.20.0 --ignore-scripts --no-audit --no-fund
          "SFUD_SMOKE_NPM_CLI=$env:RUNNER_TEMP/npm-tools/node_modules/npm/bin/npm-cli.js" >> $env:GITHUB_ENV
      - name: 공개 RC3 원본 tarball 다운로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.4.0-rc.3 --repo ts2580/sf-unlucky-deploy --dir source-release --pattern trstyq-sf-unlucky-deploy-0.4.0-rc.3.tgz
      - name: RC3 Windows x64 의존성 및 공식 SQLite binary 동봉
        run: node scripts/package-windows-bundle.mjs source-release/trstyq-sf-unlucky-deploy-0.4.0-rc.3.tgz windows-release
      - uses: actions/upload-artifact@v6
        with:
          name: rc3-windows-bundle
          path: windows-release/
          if-no-files-found: error

  offline-install:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: 고정 npm CLI 준비
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/npm-tools" npm@11.20.0 --ignore-scripts --no-audit --no-fund
          "SFUD_SMOKE_NPM_CLI=$env:RUNNER_TEMP/npm-tools/node_modules/npm/bin/npm-cli.js" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v7
        with:
          name: rc3-windows-bundle
          path: windows-release
      - name: Node 외부 통신 차단 후 빈 캐시에서 오프라인 설치·실행 검증
        shell: pwsh
        run: |
          $nodePath = (Get-Command node).Source
          $ruleName = 'SFUD RC3 offline Node test'
          New-NetFirewallRule -DisplayName $ruleName -Direction Outbound -Action Block -Program $nodePath -Profile Any | Out-Null
          try {
            node --input-type=module -e 'for (const host of ["https://github.com", "https://registry.npmjs.org"]) { let blocked = false; try { await fetch(host, {signal: AbortSignal.timeout(3000)}); } catch { blocked = true; } if (!blocked) throw new Error("Network was not blocked: " + host); console.log("Blocked: " + host); }'
            if ($LASTEXITCODE -ne 0) { throw '외부 통신 차단 검증 실패' }
            node scripts/package-smoke.mjs --windows-bundle windows-release/trstyq-sf-unlucky-deploy-0.4.0-rc.3.win32-x64.1.tgz
            if ($LASTEXITCODE -ne 0) { throw '오프라인 설치 검사 실패' }
          } finally {
            Get-NetFirewallRule -DisplayName $ruleName | Remove-NetFirewallRule
          }
