name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 소스와 태그 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 최신 main의 annotated tag인지 검증
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main --no-tags
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          npm run release:check -- "${RELEASE_TAG}"

      - name: 의존성 설치
        run: npm ci

      - name: 타입·단위·브라우저 검증
        run: |
          npx playwright install --with-deps chromium
          npm run verify

      - name: 릴리즈 패키지와 체크섬 생성
        run: |
          mkdir -p release
          npm pack --pack-destination release
          cd release
          sha256sum ./*.tgz > SHA256SUMS

      - name: 설치 스모크 검증
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          smoke_directory="$(mktemp -d)"
          npm install --global \
            --prefix "${smoke_directory}" \
            --allow-scripts=sqlite3 \
            ./release/*.tgz
          test "$("${smoke_directory}/bin/sfud" --version)" = "${RELEASE_TAG#v}"

      - name: GitHub Release 발행
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            ./release/*.tgz \
            ./release/SHA256SUMS \
            --verify-tag \
            --title "sf-unlucky-deploy ${RELEASE_TAG}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md"
